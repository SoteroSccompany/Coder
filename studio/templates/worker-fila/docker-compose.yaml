name: {{slug}}

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{slug}}-worker
    restart: unless-stopped
    environment:
      PORT: "{{port}}"
      TZ: America/Sao_Paulo
      RABBITMQ_URL: "amqp://{{rabbitUser}}:{{rabbitPassword}}@rabbitmq:5672"
      QUEUE_NAME: {{queueName}}
    env_file:
      - .env
    networks:
      - {{slug}}

networks:
  {{slug}}:
    driver: bridge
