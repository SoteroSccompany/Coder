name: login
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: login-api
    restart: unless-stopped
    ports:
      - 3210:3210
    environment:
      PORT: "3210"
      TZ: America/Sao_Paulo
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - login
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: login-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: teste
      MYSQL_USER: app
      MYSQL_PASSWORD: devapp
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - login

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./.docker/redis:/data
networks:
  login:
    driver: bridge
volumes:
  mysql-data: {}
